name: zad
description: "ZAD: surplus meals from Muscat kitchens, reserved and picked up."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  geolocator: ^14.1.1
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  intl: ^0.20.3
  mapbox_maps_flutter: ^3.33.0
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/splash/
    - assets/icons/
    - assets/auth/
    - assets/onboarding/
  # Variable Bricolage Grotesque (OFL) for the "zad" wordmark, which needs the
  # 96 pt optical size that google_fonts' static files don't have.
  fonts:
    - family: BricolageGrotesqueVariable
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
